<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<title>과외 학생 관리</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --green: #16a34a;
    --green-light: #dcfce7;
    --red: #dc2626;
    --red-light: #fee2e2;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 18px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  header p { font-size: .8rem; opacity: .85; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .stat .label { font-size: .75rem; color: var(--muted); }
  .stat .value { font-size: 1.3rem; font-weight: 700; margin-top: 2px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; background: var(--card); padding: 5px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .tab { flex: 1; border: 0; background: transparent; padding: 10px 6px; border-radius: 9px; font-size: .9rem; font-weight: 600; color: var(--muted); cursor: pointer; font-family: inherit; }
  .tab.active { background: var(--primary); color: #fff; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .toolbar input { flex: 1; }

  input, select, textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 16px; /* 모바일 확대 방지 */
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 70px; }

  .btn { border: 0; border-radius: 10px; padding: 11px 16px; font-size: .95rem; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-light { background: var(--primary-light); color: var(--primary); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-danger { background: var(--red-light); color: var(--red); }
  .btn-sm { padding: 7px 11px; font-size: .82rem; border-radius: 8px; }
  .btn:active { transform: scale(.98); }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .student-card { display: flex; flex-direction: column; gap: 8px; }
  .student-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .student-name { font-size: 1.1rem; font-weight: 700; }
  .student-meta { font-size: .85rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: .75rem; padding: 3px 9px; border-radius: 999px; background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .chip.paid { background: var(--green-light); color: var(--green); }
  .chip.unpaid { background: var(--red-light); color: var(--red); }
  .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--card); border-radius: var(--radius); }
  .empty .big { font-size: 2.4rem; margin-bottom: 6px; }

  .section-title { font-size: 1rem; font-weight: 700; margin: 4px 0 10px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--card); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .row .title { font-weight: 600; }
  .row .sub { font-size: .82rem; color: var(--muted); }

  .schedule-day { margin-bottom: 14px; }
  .schedule-day h3 { font-size: .9rem; color: var(--primary); margin-bottom: 6px; }
  .today-badge { background: var(--primary); color: #fff; font-size: .7rem; padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }

  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .month-nav strong { font-size: 1.05rem; }

  /* 모달 */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 20px 18px 24px; animation: up .2s ease; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h2 { font-size: 1.15rem; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
  .days { display: flex; gap: 5px; flex-wrap: wrap; }
  .days label { flex: 1; min-width: 38px; }
  .days input { display: none; }
  .days span { display: block; text-align: center; padding: 8px 0; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem; cursor: pointer; user-select: none; }
  .days input:checked + span { background: var(--primary); color: #fff; border-color: var(--primary); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }

  .lesson-item { border-left: 3px solid var(--primary); padding: 8px 12px; background: #fafafa; border-radius: 0 8px 8px 0; }
  .lesson-item .date { font-size: .8rem; color: var(--muted); }
  .lesson-item p { font-size: .9rem; white-space: pre-wrap; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #111827; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .9rem; transition: transform .25s; z-index: 100; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .fab { position: fixed; right: 18px; bottom: 18px; width: 58px; height: 58px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 2rem; border: 0; box-shadow: 0 6px 16px rgba(79,70,229,.4); cursor: pointer; display: none; z-index: 20; }

  footer { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 24px; }
  footer .btn { margin: 4px; }

  @media (min-width: 641px) {
    .modal-bg { align-items: center; }
    .modal { border-radius: 18px; }
  }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
    .toolbar .btn-primary { display: none; }
    .fab { display: block; }
    header h1 { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <h1>📚 과외 학생 관리</h1>
      <p id="todayText"></p>
    </div>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat"><div class="label">전체 학생</div><div class="value" id="statStudents">0</div></div>
    <div class="stat"><div class="label">오늘 수업</div><div class="value" id="statToday">0</div></div>
    <div class="stat"><div class="label">이번 달 예상 수입</div><div class="value" id="statIncome">0원</div></div>
    <div class="stat"><div class="label">이번 달 미납</div><div class="value" id="statUnpaid">0명</div></div>
  </section>

  <nav class="tabs">
    <button class="tab active" data-tab="students">학생</button>
    <button class="tab" data-tab="schedule">시간표</button>
    <button class="tab" data-tab="payments">수업료</button>
  </nav>

  <!-- 학생 탭 -->
  <section id="tab-students">
    <div class="toolbar">
      <input type="search" id="search" placeholder="이름, 학교, 과목으로 검색">
      <button class="btn btn-primary" onclick="openStudentModal()">+ 학생 추가</button>
    </div>
    <div id="studentList" class="grid"></div>
  </section>

  <!-- 시간표 탭 -->
  <section id="tab-schedule" hidden>
    <div id="scheduleList"></div>
  </section>

  <!-- 수업료 탭 -->
  <section id="tab-payments" hidden>
    <div class="month-nav">
      <button class="btn btn-light btn-sm" onclick="changeMonth(-1)">◀ 이전 달</button>
      <strong id="monthLabel"></strong>
      <button class="btn btn-light btn-sm" onclick="changeMonth(1)">다음 달 ▶</button>
    </div>
    <div id="paymentList" class="list"></div>
  </section>

  <footer>
    <p>데이터는 이 기기의 브라우저에만 저장됩니다.</p>
    <button class="btn btn-ghost btn-sm" onclick="exportData()">백업 파일 저장</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">백업 불러오기</button>
    <input type="file" id="importFile" accept=".json" hidden onchange="importData(event)">
  </footer>
</main>

<button class="fab" onclick="openStudentModal()" aria-label="학생 추가">+</button>

<!-- 학생 추가/수정 모달 -->
<div class="modal-bg" id="studentModal">
  <div class="modal">
    <h2 id="studentModalTitle">학생 추가</h2>
    <form id="studentForm">
      <input type="hidden" id="sId">
      <div class="form-grid">
        <div class="field"><label>이름 *</label><input id="sName" required placeholder="홍길동"></div>
        <div class="field"><label>학년</label>
          <select id="sGrade">
            <option value="">선택</option>
            <option>초1</option><option>초2</option><option>초3</option><option>초4</option><option>초5</option><option>초6</option>
            <option>중1</option><option>중2</option><option>중3</option>
            <option>고1</option><option>고2</option><option>고3</option>
            <option>N수생</option><option>성인</option>
          </select>
        </div>
        <div class="field"><label>학교</label><input id="sSchool" placeholder="OO중학교"></div>
        <div class="field"><label>과목</label><input id="sSubject" placeholder="수학"></div>
        <div class="field"><label>학생 연락처</label><input id="sPhone" type="tel" placeholder="010-0000-0000"></div>
        <div class="field"><label>학부모 연락처</label><input id="sParentPhone" type="tel" placeholder="010-0000-0000"></div>
        <div class="field full"><label>수업 요일</label>
          <div class="days" id="sDays"></div>
        </div>
        <div class="field"><label>수업 시간</label><input id="sTime" type="time"></div>
        <div class="field"><label>월 수업료 (원)</label><input id="sFee" type="number" inputmode="numeric" min="0" step="10000" placeholder="400000"></div>
        <div class="field full"><label>메모</label><textarea id="sMemo" placeholder="특이사항, 목표 등"></textarea></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-light" onclick="closeModal('studentModal')">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 학생 상세 / 수업 기록 모달 -->
<div class="modal-bg" id="detailModal">
  <div class="modal">
    <h2 id="detailTitle"></h2>
    <div id="detailInfo" class="student-meta" style="margin-bottom:14px"></div>
    <div class="section-title">수업 기록 추가</div>
    <form id="lessonForm">
      <div class="form-grid">
        <div class="field full"><label>날짜</label><input id="lDate" type="date" required></div>
        <div class="field full"><label>수업 내용</label><textarea id="lContent" required placeholder="오늘 배운 내용"></textarea></div>
        <div class="field full"><label>숙제</label><input id="lHomework" placeholder="다음 시간까지 숙제"></div>
      </div>
      <div class="modal-actions" style="margin-top:10px">
        <button type="submit" class="btn btn-primary">기록 추가</button>
      </div>
    </form>
    <div class="section-title" style="margin-top:18px">지난 수업 기록</div>
    <div id="lessonList" class="list"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-light" onclick="closeModal('detailModal')">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'tutor-students-v1';
  const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
  let data = load();
  let currentMonth = monthKey(new Date());
  let detailId = null;

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.students)) return saved;
    } catch (e) {}
    return { students: [] };
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    render();
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function daysText(days) { return (days || []).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => DAY_NAMES[d]).join('·'); }
  function isPaid(s, month) { return !!(s.payments && s.payments[month]); }

  // ---------- 렌더링 ----------
  function render() {
    const now = new Date();
    document.getElementById('todayText').textContent =
      now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + DAY_NAMES[now.getDay()] + ')';

    const students = data.students;
    const thisMonth = monthKey(now);
    document.getElementById('statStudents').textContent = students.length + '명';
    document.getElementById('statToday').textContent = students.filter(s => (s.days || []).includes(now.getDay())).length + '명';
    document.getElementById('statIncome').textContent = won(students.reduce((sum, s) => sum + (Number(s.fee) || 0), 0));
    document.getElementById('statUnpaid').textContent = students.filter(s => !isPaid(s, thisMonth)).length + '명';

    renderStudents();
    renderSchedule();
    renderPayments();
  }

  function renderStudents() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = data.students.filter(s =>
      !q || [s.name, s.school, s.subject, s.grade].some(v => String(v || '').toLowerCase().includes(q))
    ).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    const el = document.getElementById('studentList');
    if (!data.students.length) {
      el.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">👋</div>아직 등록된 학생이 없어요.<br>“학생 추가” 버튼을 눌러 첫 학생을 등록해 보세요.</div>';
      return;
    }
    if (!list.length) {
      el.innerHTML = '<div class="empty" style="grid-column:1/-1">검색 결과가 없어요.</div>';
      return;
    }
    const month = monthKey(new Date());
    el.innerHTML = list.map(s => {
      const paid = isPaid(s, month);
      const lessons = (s.lessons || []).length;
      return `
      <div class="card student-card">
        <div class="student-top">
          <div>
            <div class="student-name">${esc(s.name)}</div>
            <div class="student-meta">${esc([s.grade, s.school].filter(Boolean).join(' · ') || '학교 정보 없음')}</div>
          </div>
          <span class="chip ${paid ? 'paid' : 'unpaid'}">${paid ? '이번 달 납부' : '미납'}</span>
        </div>
        <div class="chips">
          ${s.subject ? `<span class="chip">${esc(s.subject)}</span>` : ''}
          ${(s.days || []).length ? `<span class="chip">${daysText(s.days)} ${esc(s.time || '')}</span>` : ''}
          ${s.fee ? `<span class="chip">월 ${won(s.fee)}</span>` : ''}
          <span class="chip">수업 기록 ${lessons}회</span>
        </div>
        ${s.phone || s.parentPhone ? `<div class="student-meta">
          ${s.phone ? `학생 <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a>` : ''}
          ${s.parentPhone ? ` · 학부모 <a href="tel:${esc(s.parentPhone)}">${esc(s.parentPhone)}</a>` : ''}
        </div>` : ''}
        ${s.memo ? `<div class="student-meta">📝 ${esc(s.memo)}</div>` : ''}
        <div class="card-actions">
          <button class="btn btn-light btn-sm" onclick="openDetail('${s.id}')">수업 기록</button>
          <button class="btn btn-light btn-sm" onclick="togglePaid('${s.id}', '${month}')">${paid ? '납부 취소' : '납부 완료'}</button>
          <button class="btn btn-ghost btn-sm" onclick="openStudentModal('${s.id}')">수정</button>
          <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">삭제</button>
        </div>
      </div>`;
    }).join('');
  }

  function renderSchedule() {
    const el = document.getElementById('scheduleList');
    const today = new Date().getDay();
    const order = [1, 2, 3, 4, 5, 6, 0];
    let html = '';
    order.forEach(d => {
      const list = data.students.filter(s => (s.days || []).includes(d))
        .sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
      html += `<div class="schedule-day"><h3>${DAY_NAMES[d]}요일${d === today ? '<span class="today-badge">오늘</span>' : ''}</h3>`;
      if (!list.length) html += '<div class="row"><span class="sub">수업 없음</span></div>';
      else html += '<div class="list">' + list.map(s => `
        <div class="row">
          <div><div class="title">${esc(s.time || '시간 미정')} · ${esc(s.name)}</div>
          <div class="sub">${esc([s.grade, s.subject].filter(Boolean).join(' · '))}</div></div>
          <button class="btn btn-light btn-sm" onclick="openDetail('${s.id}')">기록</button>
        </div>`).join('') + '</div>';
      html += '</div>';
    });
    el.innerHTML = html;
  }

  function renderPayments() {
    const [y, m] = currentMonth.split('-');
    document.getElementById('monthLabel').textContent = y + '년 ' + Number(m) + '월';
    const el = document.getElementById('paymentList');
    if (!data.students.length) {
      el.innerHTML = '<div class="empty">학생을 먼저 등록해 주세요.</div>';
      return;
    }
    const total = data.students.reduce((s, x) => s + (Number(x.fee) || 0), 0);
    const paidTotal = data.students.filter(s => isPaid(s, currentMonth)).reduce((s, x) => s + (Number(x.fee) || 0), 0);
    el.innerHTML = `
      <div class="row"><div><div class="title">받은 금액 ${won(paidTotal)}</div><div class="sub">전체 ${won(total)} 중 남은 금액 ${won(total - paidTotal)}</div></div></div>
      ` + data.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'ko')).map(s => {
        const paid = isPaid(s, currentMonth);
        return `
        <div class="row">
          <div><div class="title">${esc(s.name)} <span class="chip ${paid ? 'paid' : 'unpaid'}">${paid ? '납부' : '미납'}</span></div>
          <div class="sub">월 ${won(s.fee)}${paid ? ' · ' + esc(s.payments[currentMonth]) + ' 납부' : ''}</div></div>
          <button class="btn ${paid ? 'btn-ghost' : 'btn-primary'} btn-sm" onclick="togglePaid('${s.id}', '${currentMonth}')">${paid ? '취소' : '납부 처리'}</button>
        </div>`;
      }).join('');
  }

  // ---------- 동작 ----------
  function openModal(id) { document.getElementById(id).classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); document.body.style.overflow = ''; }
  document.querySelectorAll('.modal-bg').forEach(bg => bg.addEventListener('click', e => { if (e.target === bg) closeModal(bg.id); }));

  function buildDays(selected) {
    const order = [1, 2, 3, 4, 5, 6, 0];
    document.getElementById('sDays').innerHTML = order.map(d =>
      `<label><input type="checkbox" value="${d}" ${selected.includes(d) ? 'checked' : ''}><span>${DAY_NAMES[d]}</span></label>`
    ).join('');
  }

  function openStudentModal(id) {
    const s = data.students.find(x => x.id === id) || {};
    document.getElementById('studentModalTitle').textContent = id ? '학생 정보 수정' : '학생 추가';
    document.getElementById('sId').value = s.id || '';
    document.getElementById('sName').value = s.name || '';
    document.getElementById('sGrade').value = s.grade || '';
    document.getElementById('sSchool').value = s.school || '';
    document.getElementById('sSubject').value = s.subject || '';
    document.getElementById('sPhone').value = s.phone || '';
    document.getElementById('sParentPhone').value = s.parentPhone || '';
    document.getElementById('sTime').value = s.time || '';
    document.getElementById('sFee').value = s.fee || '';
    document.getElementById('sMemo').value = s.memo || '';
    buildDays(s.days || []);
    openModal('studentModal');
    setTimeout(() => document.getElementById('sName').focus(), 50);
  }

  document.getElementById('studentForm').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('sId').value;
    const fields = {
      name: document.getElementById('sName').value.trim(),
      grade: document.getElementById('sGrade').value,
      school: document.getElementById('sSchool').value.trim(),
      subject: document.getElementById('sSubject').value.trim(),
      phone: document.getElementById('sPhone').value.trim(),
      parentPhone: document.getElementById('sParentPhone').value.trim(),
      days: [...document.querySelectorAll('#sDays input:checked')].map(i => Number(i.value)),
      time: document.getElementById('sTime').value,
      fee: Number(document.getElementById('sFee').value) || 0,
      memo: document.getElementById('sMemo').value.trim()
    };
    if (!fields.name) return toast('이름을 입력해 주세요');
    if (id) {
      Object.assign(data.students.find(x => x.id === id), fields);
      toast('수정했어요');
    } else {
      data.students.push({ id: uid(), ...fields, lessons: [], payments: {}, createdAt: todayStr() });
      toast(fields.name + ' 학생을 추가했어요');
    }
    closeModal('studentModal');
    save();
  });

  function deleteStudent(id) {
    const s = data.students.find(x => x.id === id);
    if (!s || !confirm(s.name + ' 학생을 삭제할까요?\n수업 기록과 납부 내역도 함께 삭제됩니다.')) return;
    data.students = data.students.filter(x => x.id !== id);
    save();
    toast('삭제했어요');
  }

  function togglePaid(id, month) {
    const s = data.students.find(x => x.id === id);
    s.payments = s.payments || {};
    if (s.payments[month]) { delete s.payments[month]; toast('납부를 취소했어요'); }
    else { s.payments[month] = todayStr(); toast(s.name + ' 납부 완료!'); }
    save();
  }

  function changeMonth(diff) {
    const [y, m] = currentMonth.split('-').map(Number);
    currentMonth = monthKey(new Date(y, m - 1 + diff, 1));
    renderPayments();
  }

  function openDetail(id) {
    detailId = id;
    const s = data.students.find(x => x.id === id);
    document.getElementById('detailTitle').textContent = s.name + ' 학생';
    document.getElementById('detailInfo').textContent =
      [s.grade, s.school, s.subject, (s.days || []).length ? daysText(s.days) + ' ' + (s.time || '') : ''].filter(Boolean).join(' · ');
    document.getElementById('lDate').value = todayStr();
    document.getElementById('lContent').value = '';
    document.getElementById('lHomework').value = '';
    renderLessons();
    openModal('detailModal');
  }

  function renderLessons() {
    const s = data.students.find(x => x.id === detailId);
    const lessons = (s.lessons || []).slice().sort((a, b) => b.date.localeCompare(a.date));
    document.getElementById('lessonList').innerHTML = lessons.length ? lessons.map(l => `
      <div class="lesson-item">
        <div class="date">${esc(l.date)} <button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="deleteLesson('${l.id}')">삭제</button></div>
        <p>${esc(l.content)}</p>
        ${l.homework ? `<p class="student-meta">숙제: ${esc(l.homework)}</p>` : ''}
      </div>`).join('') : '<div class="student-meta">아직 기록이 없어요.</div>';
  }

  document.getElementById('lessonForm').addEventListener('submit', e => {
    e.preventDefault();
    const s = data.students.find(x => x.id === detailId);
    s.lessons = s.lessons || [];
    s.lessons.push({
      id: uid(),
      date: document.getElementById('lDate').value,
      content: document.getElementById('lContent').value.trim(),
      homework: document.getElementById('lHomework').value.trim()
    });
    document.getElementById('lContent').value = '';
    document.getElementById('lHomework').value = '';
    save();
    renderLessons();
    toast('수업 기록을 추가했어요');
  });

  function deleteLesson(lessonId) {
    if (!confirm('이 수업 기록을 삭제할까요?')) return;
    const s = data.students.find(x => x.id === detailId);
    s.lessons = s.lessons.filter(l => l.id !== lessonId);
    save();
    renderLessons();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '과외학생_백업_' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('백업 파일을 저장했어요');
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed.students)) throw new Error();
        if (!confirm('지금 데이터를 백업 파일 내용으로 바꿀까요?')) return;
        data = parsed;
        save();
        toast('백업을 불러왔어요');
      } catch (err) {
        alert('올바른 백업 파일이 아니에요.');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  }

  // 탭 전환
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    ['students', 'schedule', 'payments'].forEach(t => {
      document.getElementById('tab-' + t).hidden = btn.dataset.tab !== t;
    });
  }));

  document.getElementById('search').addEventListener('input', renderStudents);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-bg.open').forEach(m => closeModal(m.id));
  });

  render();
</script>
</body>
</html>
